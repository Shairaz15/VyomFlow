  <text x="140" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="52" font-weight="700" fill="#17324D" letter-spacing="-0.02em">VyomFlow</text>
